services:
  db:
    image: postgres:18
    container_name: postgres-dev
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-devtracker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
  migrate:
    image: devtracker-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["--migrate=true"]
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-devtracker};Username=postgres;Password=${POSTGRES_PASSWORD}
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      db:
        condition: service_healthy
  api:
    image: devtracker-api:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=db;Database=${POSTGRES_DB:-devtracker};Username=postgres;Password=${POSTGRES_PASSWORD}
      DataProtection__KeysPath: /app/keys
    ports:
      - "127.0.0.1:5033:8080"
    volumes:
      - data_protection:/app/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      - api

volumes:
  postgres_data:
  data_protection:
